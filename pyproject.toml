[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = 'pygmi'
dynamic = ['version']
authors = [{name = 'Patrick Cole', email = 'pcole@geoscience.org.za'}]
maintainers = [{name = 'Patrick Cole', email = 'pcole@geoscience.org.za'}]
description = 'Python Geoscience Modelling and Interpretation'
readme = 'README.rst'
requires-python = '>=3.12'
license = "GPL-3.0-or-later"
license-files = ["LICENSE.txt"]
keywords=['Geoscience', 'Geophysics', 'Magnetic', 'Gravity', 'Modelling',
          'Interpretation', 'Remote Sensing']
classifiers = [
    'Development Status :: 5 - Production/Stable',
    'Environment :: Win32 (MS Windows)',
    'Environment :: X11 Applications :: Qt',
    'Intended Audience :: Education',
    'Intended Audience :: End Users/Desktop',
    'Intended Audience :: Science/Research',
    'Natural Language :: English',
    'Operating System :: Microsoft :: Windows',
    'Operating System :: POSIX :: Linux',
    'Programming Language :: Python :: 3',
    'Topic :: Scientific/Engineering :: Mathematics',
    'Topic :: Scientific/Engineering :: Physics',
    'Topic :: Scientific/Engineering :: Image Processing',
    'Topic :: Scientific/Engineering :: Visualization',
    'Topic :: Software Development :: Libraries :: Python Modules',
]

dependencies = [
                'geopandas>=1.2.0',
                'h5netcdf>=1.8.1',
                'matplotlib>=3.11.2',
                'natsort>=8.4.0',
                'numba>=0.68.0',
                'numexpr>=2.14.2',
                'openpyxl>=3.1.5',
                'psutil>=7.2.2',
                'pyside6>=6.12.0',
                'pytest>=9.1.1',
                'pyvista>=0.49.1',
                'pyvistaqt>=0.13.1',
                'rasterio>=1.5.2',
                'rioxarray>=0.23.0',
                'scikit-learn>=1.9.1',
                'scikit-image>=0.26.0',
                'shapelysmooth>=0.2.1',
                'simpeg>=0.25.2',
                'beautifulsoup4>=4.15.0',
                'pyyaml>=6.0.3',
                'pwlf>=2.7.0',
                'contextily>=1.7.1',
                'matplotlib-map-utils>=4.1.1',
                'h5py>=3.16.0',
				'chardet>=7.7.0',
                ]

[project.urls]
homepage = 'http://patrick-cole.github.io/pygmi/'
documentation = 'https://patrick-cole.github.io/pygmi/wiki.html'
repository =  'https://github.com/Patrick-Cole/pygmi.git'
changelog = 'https://github.com/Patrick-Cole/pygmi/blob/pygmi3/CHANGES.rst'

[project.scripts]
pygmi-cli = 'pygmi.main:main'

[project.gui-scripts]
pygmi-gui = 'pygmi.main:main'
pygmi = 'pygmi.main:main'

[tool.setuptools.package-dir]
pygmi = 'pygmi'

[tool.setuptools.dynamic]
version = {attr = 'pygmi.version.__version__'}

[tool.pyright]
reportDeprecated = 'warning'
reportAttributeAccessIssue = false
reportOptionalMemberAccess = false
reportArgumentType = false
reportCallIssue = false
reportOptionalSubscript = false
reportIncompatibleMethodOverride = false
reportOperatorIssue = false
# reportPossiblyUnboundVariable = false
reportGeneralTypeIssues = false
reportIndexIssue = false
reportOptionalIterable = false
reportOptionalOperand = false
# reportPrivateImportUsage = false

[tool.ruff.lint]
# Add "D" to enable all pydocstyle rules
extend-select = ["D"] 

[tool.ruff.lint.pydocstyle]
# Choose your preferred docstring convention: "google", "numpy", or "pep257"
convention = "numpy"